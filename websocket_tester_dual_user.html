<!doctype html>
<html>
    <head>
        <title>Kitty Chat WebSocket Tester - Multi User</title>
        <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
        <style>
            body {
                margin: 0;
                padding: 20px;
                font-family: Arial, sans-serif;
                background: #f5f5f5;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }
            .user-panel {
                background: white;
                border-radius: 8px;
                padding: 20px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            }
            .user-panel h2 {
                margin: 0 0 20px 0;
                padding: 10px;
                border-radius: 4px;
                color: white;
                text-align: center;
            }
            .alice {
                background: #e91e63;
            }
            .bob {
                background: #2196f3;
            }

            .status {
                padding: 8px 12px;
                border-radius: 4px;
                margin-bottom: 15px;
                font-weight: bold;
                text-align: center;
            }
            .status.disconnected {
                background: #ffebee;
                color: #c62828;
            }
            .status.connected {
                background: #e8f5e8;
                color: #2e7d32;
            }
            .status.authenticated {
                background: #e3f2fd;
                color: #1565c0;
            }

            .log {
                height: 300px;
                overflow-y: scroll;
                border: 1px solid #ddd;
                padding: 10px;
                margin-bottom: 15px;
                background: #fafafa;
                font-family: monospace;
                font-size: 12px;
            }
            .log-entry {
                margin: 4px 0;
                padding: 4px 8px;
                border-radius: 4px;
            }
            .log-sent {
                background: #fff3e0;
                border-left: 3px solid #ff9800;
            }
            .log-received {
                background: #e8f5e8;
                border-left: 3px solid #4caf50;
            }
            .log-info {
                background: #e3f2fd;
                border-left: 3px solid #2196f3;
            }
            .log-error {
                background: #ffebee;
                border-left: 3px solid #f44336;
            }
            .log-message {
                background: #f3e5f5;
                border-left: 3px solid #9c27b0;
                font-weight: bold;
            }

            .controls {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            button {
                padding: 10px 15px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
                transition: all 0.2s;
            }
            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            button:hover:not(:disabled) {
                transform: translateY(-1px);
            }

            .btn-connect {
                background: #4caf50;
                color: white;
            }
            .btn-auth {
                background: #2196f3;
                color: white;
            }
            .btn-send {
                background: #ff9800;
                color: white;
            }
            .btn-disconnect {
                background: #f44336;
                color: white;
            }

            .message-input {
                width: 100%;
                padding: 8px;
                border: 1px solid #ddd;
                border-radius: 4px;
                margin-bottom: 10px;
            }

            .timestamp {
                color: #666;
                font-size: 10px;
            }

            .conversation-info {
                background: #e8f5e8;
                padding: 8px;
                border-radius: 4px;
                margin-bottom: 10px;
                font-size: 12px;
            }

            .header {
                text-align: center;
                margin-bottom: 30px;
            }
            .header h1 {
                color: #333;
                margin: 0;
            }
            .header p {
                color: #666;
                margin: 5px 0 0 0;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>🐱 Kitty Chat WebSocket Tester</h1>
            <p>
                Real-time testing between Alice and Bob - Perfect for mobile app
                development
            </p>
        </div>

        <div class="container">
            <!-- Alice Panel -->
            <div class="user-panel">
                <h2 class="alice">👩 Alice</h2>
                <div id="alice-status" class="status disconnected">
                    Disconnected
                </div>
                <div
                    id="alice-conversation"
                    class="conversation-info"
                    style="display: none"
                ></div>
                <div id="alice-log" class="log"></div>
                <div class="controls">
                    <button id="alice-connect" class="btn-connect">
                        Connect to Server
                    </button>
                    <button id="alice-auth" class="btn-auth" disabled>
                        Authenticate
                    </button>
                    <input
                        type="text"
                        id="alice-message"
                        class="message-input"
                        placeholder="Type message to Bob..."
                        disabled
                    />
                    <button id="alice-send" class="btn-send" disabled>
                        Send Message to Bob
                    </button>
                    <button id="alice-typing" class="btn-send" disabled>
                        Send Typing Indicator
                    </button>
                    <button
                        id="alice-disconnect"
                        class="btn-disconnect"
                        disabled
                    >
                        Disconnect
                    </button>
                </div>
            </div>

            <!-- Bob Panel -->
            <div class="user-panel">
                <h2 class="bob">👨 Bob</h2>
                <div id="bob-status" class="status disconnected">
                    Disconnected
                </div>
                <div
                    id="bob-conversation"
                    class="conversation-info"
                    style="display: none"
                ></div>
                <div id="bob-log" class="log"></div>
                <div class="controls">
                    <button id="bob-connect" class="btn-connect">
                        Connect to Server
                    </button>
                    <button id="bob-auth" class="btn-auth" disabled>
                        Authenticate
                    </button>
                    <input
                        type="text"
                        id="bob-message"
                        class="message-input"
                        placeholder="Type message to Alice..."
                        disabled
                    />
                    <button id="bob-send" class="btn-send" disabled>
                        Send Message to Alice
                    </button>
                    <button id="bob-typing" class="btn-send" disabled>
                        Send Typing Indicator
                    </button>
                    <button id="bob-disconnect" class="btn-disconnect" disabled>
                        Disconnect
                    </button>
                </div>
            </div>
        </div>

        <script>
            // User configurations with fresh tokens
            const users = {
                alice: {
                    name: 'Alice',
                    id: '18a008b0-d339-4629-99d8-f565cd8cf3e2',
                    token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MSwidXVpZCI6IjE4YTAwOGIwLWQzMzktNDYyOS05OWQ4LWY1NjVjZDhjZjNlMiIsImVtYWlsIjoiYWxpY2VAZXhhbXBsZS5jb20iLCJpYXQiOjE3NTI4NjI1NTMsImV4cCI6MTc1Mjk0ODk1M30.-02P4vnPEG2Sgcu-_ZX1yeX7zBoy5thOhqVj6DiNcvg',
                    socket: null,
                    state: {
                        connected: false,
                        authenticated: false,
                        conversationId: null
                    }
                },
                bob: {
                    name: 'Bob',
                    id: '8bc2abbf-3dde-4b42-aed4-56479d510249',
                    token: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MiwidXVpZCI6IjhiYzJhYmJmLTNkZGUtNGI0Mi1hZWQ0LTU2NDc5ZDUxMDI0OSIsImVtYWlsIjoiYm9iQGV4YW1wbGUuY29tIiwiaWF0IjoxNzUyODYyNTUzLCJleHAiOjE3NTI5NDg5NTN9.Erk2QF1oFUKz8qBXyEfeSYe31cjHxJxZo1YGnZGVgpw',
                    socket: null,
                    state: {
                        connected: false,
                        authenticated: false,
                        conversationId: null
                    }
                }
            }

            // Logging function
            function log(user, message, type = 'info') {
                const logElement = document.getElementById(`${user}-log`)
                const entry = document.createElement('div')
                entry.className = `log-entry log-${type}`

                const timestamp = new Date().toLocaleTimeString()
                entry.innerHTML = `<span class="timestamp">[${timestamp}]</span> ${message}`

                logElement.appendChild(entry)
                logElement.scrollTop = logElement.scrollHeight
            }

            // Update status display
            function updateStatus(user, status, extra = '') {
                const statusElement = document.getElementById(`${user}-status`)
                statusElement.textContent = `${status}${extra}`
                statusElement.className = `status ${status.toLowerCase().replace(' ', '-')}`

                if (status === 'Authenticated') {
                    statusElement.className = 'status authenticated'
                }
            }

            // Update conversation info
            function updateConversation(user, conversationId) {
                const convElement = document.getElementById(
                    `${user}-conversation`
                )
                if (conversationId) {
                    convElement.textContent = `Conversation: ${conversationId.substring(0, 8)}...`
                    convElement.style.display = 'block'
                    users[user].state.conversationId = conversationId
                }
            }

            // Setup user connection
            function setupUser(user) {
                const userData = users[user]
                const otherUser = user === 'alice' ? 'bob' : 'alice'

                // Connect button
                document
                    .getElementById(`${user}-connect`)
                    .addEventListener('click', function () {
                        log(user, 'Connecting to WebSocket server...', 'info')

                        userData.socket = io(
                            'http://localhost:3001/direct-chat',
                            {
                                transports: ['websocket', 'polling']
                            }
                        )

                        // Connection events
                        userData.socket.on('connect', function () {
                            userData.state.connected = true
                            updateStatus(
                                user,
                                'Connected',
                                ` (ID: ${userData.socket.id.substring(0, 6)}...)`
                            )
                            log(
                                user,
                                `Connected successfully! Socket ID: ${userData.socket.id}`,
                                'info'
                            )

                            // Update buttons
                            document.getElementById(
                                `${user}-connect`
                            ).disabled = true
                            document.getElementById(`${user}-auth`).disabled =
                                false
                            document.getElementById(
                                `${user}-disconnect`
                            ).disabled = false
                        })

                        userData.socket.on('disconnect', function () {
                            userData.state.connected = false
                            userData.state.authenticated = false
                            updateStatus(user, 'Disconnected')
                            log(user, 'Disconnected from server', 'error')

                            // Reset buttons
                            document.getElementById(
                                `${user}-connect`
                            ).disabled = false
                            document.getElementById(`${user}-auth`).disabled =
                                true
                            document.getElementById(`${user}-send`).disabled =
                                true
                            document.getElementById(`${user}-typing`).disabled =
                                true
                            document.getElementById(
                                `${user}-message`
                            ).disabled = true
                            document.getElementById(
                                `${user}-disconnect`
                            ).disabled = true
                        })

                        userData.socket.on('error', function (err) {
                            log(user, `Error: ${err}`, 'error')
                        })

                        // Welcome message
                        userData.socket.on('connected', function (data) {
                            log(
                                user,
                                `Server welcome: ${JSON.stringify(data)}`,
                                'received'
                            )
                        })

                        // Message events
                        userData.socket.on('newMessage', function (data) {
                            log(user, `📨 NEW MESSAGE RECEIVED!`, 'message')

                            if (data.message) {
                                const senderInfo = data.message.senderName
                                    ? `${data.message.senderName} (${data.message.senderId.substring(0, 8)}...)`
                                    : `${data.message.senderId.substring(0, 8)}...`

                                log(user, `👤 From: ${senderInfo}`, 'received')
                                log(
                                    user,
                                    `💬 Message: "${data.message.content}"`,
                                    'received'
                                )
                                log(
                                    user,
                                    `🔗 Conversation: ${data.conversation.substring(0, 8)}...`,
                                    'received'
                                )
                                log(
                                    user,
                                    `⏰ Time: ${new Date(data.message.createdAt).toLocaleTimeString()}`,
                                    'received'
                                )

                                // Show in conversation info
                                if (
                                    data.conversation &&
                                    !userData.state.conversationId
                                ) {
                                    updateConversation(user, data.conversation)
                                }

                                // Highlight the message visually
                                setTimeout(() => {
                                    log(
                                        user,
                                        `🔔 NEW MESSAGE ALERT: You have a new message from ${senderInfo}!`,
                                        'message'
                                    )
                                }, 100)
                            } else {
                                log(
                                    user,
                                    `Raw data: ${JSON.stringify(data)}`,
                                    'received'
                                )
                            }
                        })

                        // Other events
                        ;[
                            'userStatusChanged',
                            'userTyping',
                            'messagesRead',
                            'messageDeleted',
                            'messageEdited'
                        ].forEach(function (event) {
                            userData.socket.on(event, function (data) {
                                log(
                                    user,
                                    `${event}: ${JSON.stringify(data)}`,
                                    'received'
                                )
                            })
                        })
                    })

                // Authentication button
                document
                    .getElementById(`${user}-auth`)
                    .addEventListener('click', function () {
                        if (!userData.socket || !userData.state.connected) {
                            log(user, 'Not connected to server', 'error')
                            return
                        }

                        log(user, 'Sending authentication...', 'sent')

                        userData.socket.emit(
                            'authenticate',
                            { token: userData.token },
                            function (response) {
                                log(
                                    user,
                                    `Auth response: ${JSON.stringify(response)}`,
                                    'received'
                                )

                                if (response && response.success) {
                                    userData.state.authenticated = true
                                    updateStatus(
                                        user,
                                        'Authenticated',
                                        ` (${userData.name})`
                                    )
                                    log(
                                        user,
                                        `✅ Successfully authenticated as ${userData.name}!`,
                                        'info'
                                    )

                                    // Enable messaging
                                    document.getElementById(
                                        `${user}-send`
                                    ).disabled = false
                                    document.getElementById(
                                        `${user}-typing`
                                    ).disabled = false
                                    document.getElementById(
                                        `${user}-message`
                                    ).disabled = false
                                    document.getElementById(
                                        `${user}-auth`
                                    ).disabled = true
                                } else {
                                    log(
                                        user,
                                        `❌ Authentication failed: ${response ? response.error : 'Unknown error'}`,
                                        'error'
                                    )
                                }
                            }
                        )
                    })

                // Send message button
                document
                    .getElementById(`${user}-send`)
                    .addEventListener('click', function () {
                        const messageInput = document.getElementById(
                            `${user}-message`
                        )
                        const content = messageInput.value.trim()

                        if (!content) {
                            log(user, 'Please enter a message', 'error')
                            return
                        }

                        if (!userData.state.authenticated) {
                            log(user, 'Please authenticate first', 'error')
                            return
                        }

                        const messageData = userData.state.conversationId
                            ? {
                                  conversationId: userData.state.conversationId,
                                  type: 'text',
                                  content: content
                              }
                            : {
                                  recipientId: users[otherUser].id,
                                  type: 'text',
                                  content: content
                              }

                        log(user, `Sending message: "${content}"`, 'sent')
                        log(
                            user,
                            `Message data: ${JSON.stringify(messageData)}`,
                            'sent'
                        )

                        userData.socket.emit(
                            'sendMessage',
                            messageData,
                            function (response) {
                                log(
                                    user,
                                    `Send response: ${JSON.stringify(response)}`,
                                    'received'
                                )

                                if (response && response.success) {
                                    log(
                                        user,
                                        '✅ Message sent successfully!',
                                        'info'
                                    )
                                    messageInput.value = ''

                                    if (
                                        response.message &&
                                        response.message.conversationId
                                    ) {
                                        updateConversation(
                                            user,
                                            response.message.conversationId
                                        )
                                    }
                                } else {
                                    log(
                                        user,
                                        `❌ Failed to send message: ${response ? response.error : 'Unknown error'}`,
                                        'error'
                                    )
                                }
                            }
                        )
                    })

                // Send typing indicator
                document
                    .getElementById(`${user}-typing`)
                    .addEventListener('click', function () {
                        if (!userData.state.conversationId) {
                            log(
                                user,
                                'No active conversation for typing indicator',
                                'error'
                            )
                            return
                        }

                        userData.socket.emit(
                            'typing',
                            {
                                conversationId: userData.state.conversationId,
                                isTyping: true
                            },
                            function (response) {
                                log(
                                    user,
                                    `Typing indicator sent: ${JSON.stringify(response)}`,
                                    'sent'
                                )
                            }
                        )
                    })

                // Disconnect button
                document
                    .getElementById(`${user}-disconnect`)
                    .addEventListener('click', function () {
                        if (userData.socket) {
                            userData.socket.disconnect()
                        }
                    })

                // Enter key to send message
                document
                    .getElementById(`${user}-message`)
                    .addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') {
                            document.getElementById(`${user}-send`).click()
                        }
                    })
            }

            // Initialize both users
            setupUser('alice')
            setupUser('bob')

            // Add initial instructions
            log(
                'alice',
                '👋 Welcome Alice! Click "Connect to Server" to start',
                'info'
            )
            log(
                'bob',
                '👋 Welcome Bob! Click "Connect to Server" to start',
                'info'
            )

            log('alice', '📋 Testing Steps:', 'info')
            log(
                'alice',
                '1. Connect → 2. Authenticate → 3. Send messages',
                'info'
            )
            log('bob', '📋 Testing Steps:', 'info')
            log(
                'bob',
                '1. Connect → 2. Authenticate → 3. Send messages',
                'info'
            )
        </script>
    </body>
</html>
