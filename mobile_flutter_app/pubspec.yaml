name: kitty_group_chat
description: A Flutter app for real-time group chat functionality with WebSocket integration

publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: '>=3.0.0 <4.0.0'

dependencies:
    flutter:
        sdk: flutter

    # WebSocket and HTTP
    socket_io_client: ^2.0.3+1
    dio: ^5.3.2
    http: ^1.1.0

    # State Management
    flutter_bloc: ^8.1.3
    equatable: ^2.0.5

    # Local Storage
    shared_preferences: ^2.2.2
    hive: ^2.2.3
    hive_flutter: ^1.1.0

    # Navigation
    go_router: ^12.1.1

    # UI Components
    cached_network_image: ^3.3.0
    flutter_chat_ui: ^1.6.8
    image_picker: ^1.0.4
    file_picker: ^6.1.1
    permission_handler: ^11.0.1

    # Utils
    uuid: ^4.1.0
    timeago: ^3.6.0
    logger: ^2.0.2+1
    connectivity_plus: ^5.0.1

    # Notifications
    flutter_local_notifications: ^16.1.0

    # Icons and Fonts
    cupertino_icons: ^1.0.2
    google_fonts: ^6.1.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^3.0.0
    hive_generator: ^2.0.1
    build_runner: ^2.4.7

flutter:
    uses-material-design: true

    assets:
        - assets/images/
        - assets/icons/

    fonts:
        - family: CustomIcons
          fonts:
              - asset: assets/fonts/custom_icons.ttf
